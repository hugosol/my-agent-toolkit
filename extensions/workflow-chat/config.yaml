# Deployment configuration, resolved from the assembly's repository, never the node cwd.
endpoint: http://127.0.0.1:18787
requestTimeoutMs: 30000
# Manual report approval wait; independent of HTTP budgets.
reportConfirmationTimeoutMs: 20000
# Backend defaults to 5400 seconds; leave a whole-exchange margin (91 minutes).
collectTimeoutMs: 5460000
