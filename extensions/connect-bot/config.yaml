# The herdr-bot panel this extension registers sessions with.
#
# The file is the machine's single source for the panel's values: the framework reads and
# validates it before the extension registers anything, and no default or fallback lives in
# code, so a missing or illegal file refuses the extension instead of letting it run on an
# invented value.
#
# Same host, so loopback: the panel listens on 0.0.0.0:8787 and a loopback address answers in
# milliseconds. The panel's mDNS name (herdr-bot.local) is for browsers and LAN devices; resolving
# it can take longer than the request budget below on first use (1000ms as shipped), which reads
# as a failed arm.
# Point this at another host only when the panel really runs there.
endpoint: "http://127.0.0.1:8787"

# The wait budget of one request, in milliseconds: every request this extension makes waits at
# most this long — register, unregister and the background heartbeat/state pushes share it, and
# no path keeps a budget of its own. A whole number of milliseconds the harness's timer
# schedules, from 1 to 2147483647; the framework refuses the extension at binding for anything
# else.
#
# This file is the only source: there is no code default, no environment override and no
# hot-reload entry, so no fallback value stands in for a missing or illegal entry, and a changed
# value takes effect only with the next process (a restart).
#
# This budget is the client's own: the panel's online window and scan cadence are server-side
# numbers derived from nothing sent here — adjusting this budget needs no change to herdr-bot — and
# a request that times out does not prove the panel did not handle it. Panel session registration
# (the row's presence) and Panel session online status (the panel's own judgement) stay two
# different things.
requestTimeoutMs: 1000
