# The automatic startup mode's policy.
#
# This file is selected by the entrypoint, not by a host parameter: an automatic entrypoint
# (`entrypoints/<host>-auto/<extension>.ts`) assembles its extension against this document, and
# the manual entrypoint (`entrypoints/<host>/<extension>.ts`) assembles the same extension
# against `manual.yaml`. Loading one mode's entrypoint and not the other is what selects a mode;
# loading both for one extension in one process is not supported (the host adds extension
# sources rather than merging them).
#
# The document is read once per process, by the framework, and only the block of the extension
# actually loaded is read: naming an extension here never loads it, and a block for an extension
# this process did not load is not validated. A loaded extension's block states its initial
# activation choice as a boolean; the framework applies that choice at the process's first main
# session start and only when the session has no recorded value of its own. A recorded value —
# `true` or `false` — always wins, so a session the operator disabled stays disabled when it is
# resumed in this mode.
#
# The choice is a target, not a toggle: an extension whose recorded value is already `true`
# stays enabled and is not switched off. For an extension whose own activation is a live
# external effect, "enabled" is the intent the framework hands its implementation; it is not a
# claim that the effect has already succeeded.
codebase-tools:
  enabled: true
connect-bot:
  enabled: true
