# The manual mode's startup policy.
#
# This file is selected by the entrypoint, not by a host parameter: a manual entrypoint
# (`entrypoints/<host>/<extension>.ts`) assembles its extension against this document, and the
# automatic entrypoint (`entrypoints/<host>-auto/<extension>.ts`) assembles the same extension
# against `auto.yaml`. Loading one mode's entrypoint and not the other is what selects a mode.
#
# The document is read once per process, by the framework, and only the block of the extension
# actually loaded is read: naming an extension here never loads it, and a block for an extension
# this process did not load is not validated. A loaded extension's block states its initial
# activation choice as a boolean; the framework applies that choice at the process's first main
# session start and only when the session has no recorded value of its own.
#
# Manual mode means an extension starts off and waits for its command, so the choice is stated
# as `false` rather than omitted. It is not a record: nothing is written for a session that
# starts off and is never enabled.
codebase-tools:
  enabled: false
connect-bot:
  enabled: false
