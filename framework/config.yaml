# The framework's shared configuration, shipped as an explicit example.
#
# It is optional and read once per process: an edited value takes effect with the next process.
# A request that names a proxy is resolved against the `http.proxies` table below. An entry is used
# only when it says `enabled: true`; any other entry is an explicitly disabled one that connects
# directly. A name the file cannot resolve (no file, no table, no entry) is refused before anything
# is sent.
#
# `http.proxies.<name>.url` is the proxy's own address — `http://` or `https://` is the protocol of
# the connection *to the proxy*, not of the target — and it is read only while `enabled` is true. The
# `codex` entry below is the example that matters for model-cost: its Codex allowance query selects
# the proxy named `codex`.
http:
  proxies:
    codex:
      enabled: true
      url: "http://127.0.0.1:10808"
